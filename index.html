<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Imppus Cave!</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #ffffff;
        }
        header {
            background: #00ffea;
            color: rgb(83, 255, 232);
            padding: 20px;
            text-align: center;
        }
        nav {
            background: white;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
            font-weight: bold;
        }
        nav a.button {
            border: 1px solid black;
            padding: 5px 10px;
            background-color: white;
            color: black;
        }
        button {
            background-color: white;
            color: black;
            border: 1px solid black;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
        }
        button.youtube {
            background-color: rgb(202, 0, 0);
            color: white;
        }
        button.twitch {
            background-color: rgb(100, 0, 100);
            color: white;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            padding: 20px;
        }
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
